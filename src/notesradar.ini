[notesradar]
; ============================================================================
; !! IMPORTANT: NEVER disable EnablePlayerCap while playing on an ONLINE server.
;    With it disabled the player radar (PNR) may exceed 200.00, can be recorded
;    by the server as an abnormal value, and may get your account banned.
;    Keep EnablePlayerCap=1 whenever you are online.
; ============================================================================

; Chart radar cap unlock: allow values above 200.00 (song select / sub screen)
EnableCap=1

; Player radar (PNR) settlement/report capped at 200.00  -- KEEP 1 ONLINE
EnablePlayerCap=1

; 2dxtra compatibility:
;   0 = off (stable, recommended)
;   1 = diagnostic only (log, no behaviour change)
;   2 = experimental (skip 2dxtra write-back when game value is already >200)
; NOTE: modes 1/2 patch 2dxtra's call site; its code does not follow the
; Windows x64 ABI (r9 preserved, non-aligned stack), and repeated attempts
; still end in a silent crash. Keep 0 unless you are capturing logs.
Enable2dxCompat=2

; Ctrl+Alt+R = call the game's own "recalculate all chart radar" routine
EnableRecalcKey=1
